services:
  postgres:
    image: postgres:16-alpine
    container_name: fishmap-postgres
    env_file:
      - ./backend/services/auth/.env
    ports:
      - "5434:5432"
    volumes:
      - fishmap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fishmap_postgres_data:
